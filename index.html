<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The home of HorizonSync — project updates and resources, all in one place.">
    <meta name="theme-color" content="#101820">
    <title>HorizonSync — A clearer view of what's ahead</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101820;
        color: #f3f5f4;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background:
          radial-gradient(ellipse at 50% 70%, rgb(63 131 129 / 18%), transparent 48%),
          #101820;
      }

      .wrap {
        width: min(100% - 3rem, 1120px);
        margin-inline: auto;
      }

      header {
        padding-block: 1.75rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        color: inherit;
        font-size: 1.05rem;
        font-weight: 650;
        letter-spacing: 0.02em;
        text-decoration: none;
      }

      .brand-mark {
        width: 2rem;
        height: 2rem;
        display: grid;
        place-items: center;
        border: 1px solid rgb(158 218 197 / 40%);
        border-radius: 50%;
        color: #9edac5;
        font-size: 1.2rem;
      }

      main {
        display: grid;
        place-items: center;
        padding-block: 5rem;
        text-align: center;
      }

      .hero {
        max-width: 760px;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #9edac5;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 9vw, 6.8rem);
        font-weight: 600;
        letter-spacing: -0.075em;
        line-height: 0.98;
      }

      h1 span {
        display: block;
        color: #9edac5;
      }

      .intro {
        max-width: 540px;
        margin: 1.75rem auto 0;
        color: #b7c1c5;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .button {
        min-height: 3rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 2rem;
        padding: 0.75rem 1.25rem;
        border: 1px solid #9edac5;
        border-radius: 999px;
        color: #101820;
        background: #9edac5;
        font-size: 0.95rem;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .button:hover {
        color: #9edac5;
        background: transparent;
      }

      .button:focus-visible,
      .brand:focus-visible {
        outline: 3px solid #f3f5f4;
        outline-offset: 4px;
      }

      footer {
        padding-block: 1.5rem;
        border-top: 1px solid rgb(243 245 244 / 10%);
        color: #89979d;
        font-size: 0.85rem;
        text-align: center;
      }

      footer p {
        margin: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="wrap">
      <a class="brand" href="./" aria-label="HorizonSync home">
        <span class="brand-mark" aria-hidden="true">⌁</span>
        HorizonSync
      </a>
    </header>
    <main class="wrap">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">A new perspective</p>
        <h1 id="hero-title">A clearer view of <span>what's ahead.</span></h1>
        <p class="intro">Welcome to HorizonSync. This is the home for project updates, resources, and what comes next.</p>
        <a class="button" href="https://github.com/thieu-celly/HorizonSync">Explore the project</a>
      </section>
    </main>
    <footer>
      <p class="wrap">HorizonSync <span aria-hidden="true">·</span> Built for the journey ahead.</p>
    </footer>
  </body>
</html>
